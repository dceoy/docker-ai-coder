min_version = "2026.9.17"

[settings]
lockfile = true
minimum_release_age = "1d"

[settings.aqua]
github_attestations = false

[tools]
actionlint = "latest"
hadolint = "latest"
herdr = "latest"
terragrunt = "latest"
zizmor = "latest"
"github:anomalyco/opencode" = "latest"
"github:anthropics/claude-code" = "latest"
"github:google-antigravity/antigravity-cli" = { version = "latest", matching = "agy_cli", rename_exe = { antigravity = "agy" } }

[tools."http:cursor-agent"]
# Pin Cursor's current release because its installer exposes no release history.
version = "2026.10.01-e373342"
strip_components = 1
rename_exe = "agent"

[tools."http:cursor-agent".platforms]
linux-x64 = { url = "https://downloads.cursor.com/lab/{{ version }}/linux/x64/agent-cli-package.tar.gz" }
linux-arm64 = { url = "https://downloads.cursor.com/lab/{{ version }}/linux/arm64/agent-cli-package.tar.gz" }
macos-x64 = { url = "https://downloads.cursor.com/lab/{{ version }}/darwin/x64/agent-cli-package.tar.gz" }
macos-arm64 = { url = "https://downloads.cursor.com/lab/{{ version }}/darwin/arm64/agent-cli-package.tar.gz" }
