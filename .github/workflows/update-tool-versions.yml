---
name: Update tool versions
on:
  schedule:
    - cron: '17 0 * * 1'
  workflow_dispatch:  # checkov:skip=CKV_GHA_7:manual runs do not accept inputs
permissions: {}
concurrency:
  group: update-tool-versions
  cancel-in-progress: false
jobs:
  update-tool-versions:
    permissions:
      contents: write
      pull-requests: write
    uses: dceoy/gha-for-devops/.github/workflows/tool-versions-upgrade-and-pr.yml@main  # zizmor: ignore[unpinned-uses]
    with:
      runs-on: ubuntu-26.04-arm
      uv-packages: checkov yamllint
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
