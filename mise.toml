min_version = "2026.7.12"

[settings]
lockfile = true
minimum_release_age = "1d"

[settings.aqua]
github_attestations = false

[tools]
actionlint = "latest"
hadolint = "latest"
herdr = "latest"
terragrunt = "latest"
uv = "latest"
"github:anomalyco/opencode" = "latest"
"github:anthropics/claude-code" = "latest"
"github:google-antigravity/antigravity-cli" = { version = "latest", matching = "agy_cli", rename_exe = { antigravity = "agy" } }
"npm:@github/copilot" = "latest"
"npm:@openai/codex" = "latest"
"npm:@openai/codex-security" = "latest"
"npm:@playwright/cli" = "latest"
"npm:@steipete/oracle" = "latest"
"npm:agent-browser" = "latest"
"pipx:checkov" = "latest"
"pipx:zizmor" = "latest"
