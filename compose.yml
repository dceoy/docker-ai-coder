---
services:
  herdr:
    container_name: herdr
    image: ghcr.io/dceoy/ai-coder:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: cli
      secrets:
        - GH_TOKEN
      args:
        DEBIAN_TAG: trixie-dev
        USER_NAME: agent
        USER_UID: '1001'
        USER_GID: '1001'
        ZSH_THEME: nicoulaj
        GIT_USER_NAME: claude
        GIT_USER_EMAIL: noreply@anthropic.com
      cache_from:
        - type=gha
      cache_to:
        - type=gha,mode=max
    tty: true
    stdin_open: true
    volumes:
      - .:/workspace
      - home-data:/home/agent
    user: agent
    working_dir: /workspace
    environment:
      GH_TOKEN: ${GH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    entrypoint:
      - /usr/bin/tini
      - --
      - /opt/cli/entrypoint.sh
    command:
      - herdr
      - server
  hermes:
    extends:
      service: herdr
    profiles:
      - hermes
    container_name: hermes
    restart: unless-stopped
    environment:
      HERMES_HOME: /var/lib/hermes
    volumes:
      - hermes-data:/var/lib/hermes
    command:
      - hermes
      - gateway
      - run
volumes:
  home-data:
  hermes-data:
secrets:
  GH_TOKEN:
    environment: GH_TOKEN
