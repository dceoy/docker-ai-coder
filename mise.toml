min_version = "2026.9.17"

[settings]
lockfile = true
minimum_release_age = "1d"

[settings.aqua]
github_attestations = false

[plugins]
gcloud = "https://github.com/mise-plugins/vfox-gcloud.git#111300c330e2f69065080abccde1d3ad42d582df"

[tools]
actionlint = "latest"
awscli = "2"
gcloud = "587.0.0"
hadolint = "latest"
herdr = "latest"
terragrunt = "latest"
zizmor = "latest"
"github:anomalyco/opencode" = "latest"
"github:anthropics/claude-code" = "latest"
"github:google-antigravity/antigravity-cli" = { version = "latest", matching = "agy_cli", rename_exe = { antigravity = "agy" } }
