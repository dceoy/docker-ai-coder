min_version = "2026.9.17"

[settings]
lockfile = true
minimum_release_age = "1d"

[settings.aqua]
github_attestations = false

[tools]
actionlint = "latest"
awscli = "2"
gcloud = "latest"
hadolint = "latest"
herdr = "latest"
terragrunt = "latest"
zizmor = "latest"
"github:anomalyco/opencode" = "latest"
"github:anthropics/claude-code" = "latest"
"github:google-antigravity/antigravity-cli" = { version = "latest", matching = "agy_cli", rename_exe = { antigravity = "agy" } }

[tools."github:NousResearch/hermes-agent"]
version = "2026.9.24"
lazy = true
lazy_bins = ["install.sh"]
os = ["linux", "macos"]
strip_components = 1
bin_path = "scripts"
filter_bins = ["install.sh"]

[tools."github:NousResearch/hermes-agent".platforms]
linux-x64 = { url = "https://github.com/NousResearch/hermes-agent/archive/refs/tags/v{{ version }}.tar.gz" }
linux-arm64 = { url = "https://github.com/NousResearch/hermes-agent/archive/refs/tags/v{{ version }}.tar.gz" }
macos-x64 = { url = "https://github.com/NousResearch/hermes-agent/archive/refs/tags/v{{ version }}.tar.gz" }
macos-arm64 = { url = "https://github.com/NousResearch/hermes-agent/archive/refs/tags/v{{ version }}.tar.gz" }
