---
name: Update tool versions
on:
  schedule:
    - cron: '17 0 * * 1'
  workflow_dispatch:  # checkov:skip=CKV_GHA_7:manual runs do not accept inputs
permissions: {}
concurrency:
  group: update-tool-versions
  cancel-in-progress: false
jobs:
  renovate:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    uses: dceoy/gha-for-devops/.github/workflows/renovate.yml@b7d9e0c64d9cd6d7198da715b11a4648373e9a23
    with:
      dry-run: false
      allow-unsafe-mise-execution: true
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
