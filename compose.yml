---
services:
  herdr:
    container_name: herdr
    image: ghcr.io/dceoy/ai-coder:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: cli
      platforms:
        - linux/arm64
        - linux/amd64
      args:
        UBUNTU_VERSION: '26.04'
        USER_NAME: agent
        USER_UID: '1001'
        USER_GID: '1001'
        ZSH_THEME: nicoulaj
        GIT_USER_NAME: claude
        GIT_USER_EMAIL: noreply@anthropic.com
      cache_from:
        - type=gha
      cache_to:
        - type=gha,mode=max
    tty: true
    stdin_open: true
    volumes:
      - .:/workspace
      - home-data:/home/agent
    user: agent
    working_dir: /workspace
    post_start:
      - command: bash -c '[[ -d /home/agent/.claude ]] || rsync -au /opt/agent/ /home/agent/'
        user: root
      - command: git config --global --add safe.directory /workspace
        user: agent
    environment:
      GH_TOKEN: ${GH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    entrypoint:
      - tini
      - --
    command:
      - herdr
      - server
volumes:
  home-data:
