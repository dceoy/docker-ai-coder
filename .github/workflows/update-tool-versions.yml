---
name: Update tool versions
on:
  schedule:
    - cron: '17 0 * * 1'
  workflow_dispatch:  # checkov:skip=CKV_GHA_7:manual runs do not accept inputs
permissions: {}
concurrency:
  group: update-tool-versions
  cancel-in-progress: false
jobs:
  update-tool-versions:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8  # v5.1.2
        with:
          install: false
          cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11
          run_install: false
      - name: Upgrade version specifications and lockfiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mise trust mise.toml
          mise upgrade --bump --local --exclude github:NousResearch/hermes-agent
          # Explicitly bump the pinned lazy Hermes tool as well as regular tools.
          mise upgrade --bump --local github:NousResearch/hermes-agent
          mise lock --bump
          uv lock --upgrade
          uv lock --check
          pnpm runtime set node "$(jq -r '.devEngines.runtime.version | split(".")[0]' package.json)"
          pnpm update --latest --ignore-scripts
          pnpm install --lockfile-only --frozen-lockfile --ignore-scripts
      - name: Create update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}  # zizmor: ignore[secrets-outside-env] optional caller-provided token
          branch: chore/update-tool-versions
          delete-branch: true
          add-paths: |
            mise.toml
            mise.lock
            pyproject.toml
            uv.lock
            package.json
            pnpm-lock.yaml
          commit-message: "chore: update mise, uv, and pnpm tool versions"
          title: "chore: update mise, uv, and pnpm tool versions"
          body: |
            Update tool version specifications and lockfiles using mise, uv, and pnpm,
            including the pinned Hermes Agent release and its source-archive URLs.
            Review compatibility and CI before merging. No automatic merging.
