---
name: Update tool versions
on:
  schedule:
    - cron: '17 0 * * 1'
  workflow_dispatch:  # checkov:skip=CKV_GHA_7:manual runs do not accept inputs
permissions: {}
concurrency:
  group: renovate
  cancel-in-progress: false
jobs:
  renovate:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    uses: dceoy/gha-for-devops/.github/workflows/renovate.yml@c073f5aac73a01f514f576ad5e7837fdbee7e96e  # v2.3.6
    with:
      allowed-unsafe-executions: '["mise"]'
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
