name: Refresh Pi lockfile (temporary)
on:
  push:
    branches:
      - feat/install-pi-agent
    paths:
      - .github/workflows/pi-lockfile-refresh.yml
permissions:
  contents: write
jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
          run_install: false
      - name: Resolve and commit Pi dependencies
        run: |
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --lockfile-only --frozen-lockfile --ignore-scripts
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: lock Pi coding agent dependencies'
            git push origin HEAD:feat/install-pi-agent
          fi
