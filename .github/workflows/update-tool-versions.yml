---
name: Update tool versions
on:
  schedule:
    - cron: '17 0 * * 1'
  workflow_dispatch:  # checkov:skip=CKV_GHA_7:manual runs do not accept inputs
permissions: {}
concurrency:
  group: update-tool-versions
  cancel-in-progress: false
jobs:
  update-tool-versions:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3
        with:
          install: false
          cache: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 11
          run_install: false
      - name: Upgrade version specifications and lockfiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mise trust mise.toml
          mise upgrade --bump --local
          mise lock --bump
          uv lock --upgrade
          uv lock --check
          pnpm runtime set node "$(jq -r '.devEngines.runtime.version | split(".")[0]' package.json)"
          pnpm update --latest --ignore-scripts
          pnpm install --lockfile-only --frozen-lockfile --ignore-scripts
      - name: Create update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}  # zizmor: ignore[secrets-outside-env] optional caller-provided token
          branch: chore/update-tool-versions
          delete-branch: true
          add-paths: |
            mise.toml
            mise.lock
            pyproject.toml
            uv.lock
            package.json
            pnpm-lock.yaml
          commit-message: "chore: update mise, uv, and pnpm tool versions"
          title: "chore: update mise, uv, and pnpm tool versions"
          body: |
            Update tool version specifications and lockfiles using mise, uv, and pnpm.
            Review compatibility and CI before merging. No automatic merging.
