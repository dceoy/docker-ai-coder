---
name: CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:  # checkov:skip=CKV_GHA_7:workflow_dispatch inputs are required to select the pipeline
    inputs:
      workflow:
        required: true
        type: choice
        options:
          - lint-and-scan
          - build
        description: Choose the workflow to run
        default: lint-and-scan
permissions: {}
jobs:
  compose-runtime-smoke:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Validate Compose profiles and inherited security settings
        env:
          GH_TOKEN: ci-placeholder
          CODEX_WS_TOKEN: ci-placeholder
        run: |
          set -euo pipefail
          docker compose --profile hermes --profile codex config --quiet
          docker compose --profile hermes --profile codex config --format json | jq -e '
            .services as $services
            | all(["herdr", "hermes", "codex-app-server"][];
                . as $service
                | ($services[$service].user == "agent")
                  and (($services[$service].cap_drop | index("ALL")) != null)
                  and (($services[$service].security_opt | index("no-new-privileges:true")) != null)
                  and ($services[$service].pids_limit == -1)
              )
          '
          AI_CODER_PIDS_LIMIT=2048 docker compose --profile hermes --profile codex config --format json |
            jq -e '[.services[].pids_limit] | all(.[]; . == 2048)'
      - name: Smoke-test the agent containers with restricted privileges
        env:
          GH_TOKEN: ci-placeholder
          CODEX_WS_TOKEN: ci-placeholder
        run: |
          set -euo pipefail
          docker compose pull herdr
          for service in herdr hermes codex-app-server; do
            docker compose --profile hermes --profile codex run -T --rm --no-deps "$service" sh -eu -c '
              test "$(id -un)" = agent
              grep -Eq "^NoNewPrivs:[[:space:]]+1$" /proc/self/status
              grep -Eq "^CapEff:[[:space:]]+0+$" /proc/self/status
              command -v herdr
              command -v hermes
              command -v codex
            '
          done
  docker-lint-and-scan:
    permissions:
      contents: read
    uses: dceoy/gha-for-devops/.github/workflows/docker-lint-and-scan.yml@main  # zizmor: ignore[unpinned-uses]
    with:
      use-trivy: false
      use-semgrep: false
      runs-on: ubuntu-26.04-arm
  source-security-scan:
    permissions:
      contents: read
    uses: dceoy/gha-for-devops/.github/workflows/source-security-scan.yml@main  # zizmor: ignore[unpinned-uses]
    with:
      use-osv-scanner: false
      use-trivy: false
      use-semgrep: true
      semgrep-includes: |
        Dockerfile*
        *.dockerfile
      runs-on: ubuntu-slim
  source-trivy-scan:
    permissions:
      contents: write
    uses: dceoy/gha-for-devops/.github/workflows/trivy-scan.yml@main  # zizmor: ignore[unpinned-uses]
    with:
      scan-ref: .
      submit-dependencies: true
      snapshot-correlator: source
      report-format: sarif
      trivy-report-artifact-name: trivy-report
      runs-on: ubuntu-slim
  docker-build-and-push:
    if: >-
      always()
      && (
        github.event_name == 'pull_request'
        || github.event_name == 'push'
        || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'build')
      )
      && (
        github.event_name == 'pull_request'
        || (needs.docker-lint-and-scan.result == 'success' && needs.source-trivy-scan.result == 'success')
      )
    needs:
      - docker-lint-and-scan
      - source-trivy-scan
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: dceoy/gha-for-devops/.github/workflows/docker-build-and-push.yml@main  # zizmor: ignore[unpinned-uses]
    with:
      registry: ghcr.io
      login-dhi: true
      registry-user: ${{ github.repository_owner }}
      image-name: ${{ github.repository_owner }}/ai-coder
      context: .
      file: ./Dockerfile
      platforms: linux/arm64
      push: ${{ github.event_name != 'pull_request' }}
      submit-dependencies: true
      scan-before-build: false
      scan-after-build: ${{ github.event_name != 'pull_request' }}
      runs-on: ubuntu-26.04-arm
    secrets:
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_SECRETS: GH_TOKEN=${{ secrets.GITHUB_TOKEN }}
  dependabot-auto-merge:
    if: >
      github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    uses: dceoy/gha-for-devops/.github/workflows/dependabot-auto-merge.yml@main  # zizmor: ignore[unpinned-uses]
    with:
      unconditional: true
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
