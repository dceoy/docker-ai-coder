---
services:
  herdr:
    container_name: herdr
    image: ghcr.io/dceoy/ai-coder:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: cli
      secrets:
        - GH_TOKEN
      args:
        DEBIAN_TAG: trixie-dev
        USER_NAME: agent
        USER_UID: '1001'
        USER_GID: '1001'
        ZSH_THEME: nicoulaj
        GIT_USER_NAME: claude
        GIT_USER_EMAIL: noreply@anthropic.com
      cache_from:
        - type=gha
      cache_to:
        - type=gha,mode=max
    tty: true
    stdin_open: true
    volumes:
      - .:/workspace
      - home-data:/home/agent
    user: agent
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${AI_CODER_PIDS_LIMIT:--1}
    working_dir: /workspace
    environment:
      GH_TOKEN: ${GH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    entrypoint:
      - /usr/bin/tini
      - --
      - /opt/cli/entrypoint.sh
    command:
      - herdr
      - server
  hermes:
    extends:
      service: herdr
    profiles:
      - hermes
    container_name: hermes
    restart: unless-stopped
    environment:
      HERMES_HOME: /var/lib/hermes
    volumes:
      - hermes-data:/var/lib/hermes
    command:
      - hermes
      - gateway
      - run
  codex-app-server:
    extends:
      service: herdr
    profiles:
      - codex
    container_name: codex-app-server
    restart: unless-stopped
    tty: false
    stdin_open: false
    environment:
      # `extends` merges environment maps; blank credentials inherited from herdr.
      GH_TOKEN: ''
      ANTHROPIC_API_KEY: ''
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - '127.0.0.1:4500:4500'
    secrets:
      - CODEX_WS_TOKEN
    command:
      - codex
      - app-server
      - --listen
      - ws://0.0.0.0:4500
      - --ws-auth
      - capability-token
      - --ws-token-file
      - /run/secrets/CODEX_WS_TOKEN
volumes:
  home-data:
  hermes-data:
secrets:
  CODEX_WS_TOKEN:
    environment: CODEX_WS_TOKEN
  GH_TOKEN:
    environment: GH_TOKEN
